
name: Python application

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:

  # 1. Construcción e instalación
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install flake8 pytest pytest-cov pip-audit

          python -m pip install --upgrade \
            "filelock>=4.2.1" \
            "setuptools>=84.1.0"

          python -m pip check

  # 2. Búsqueda de archivos
  search:
    name: Búsqueda de archivos
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Verificar estructura del proyecto
        run: |
          echo "Directorio actual:"
          pwd

          echo "Archivos y carpetas:"
          ls -la

          echo "Buscar talleres:"
          find . -type f \( \
            -name "taller1.py" -o \
            -name "taller2.py" \
          \)

  # 3. Ejecución de talleres
  exec:
    name: Ejecutar talleres Python
    runs-on: ubuntu-latest
    needs: search

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar talleres Python
        shell: bash
        run: |
          if [ ! -d "Python" ]; then
            echo "ERROR: No existe la carpeta Python"
            exit 1
          fi

          archivos=("taller1.py" "taller2.py")

          mensajes=(
            "Primer PY desarrollado"
            "Segundo PY desarrollado"
          )

          for i in "${!archivos[@]}"; do
            echo "=================================="

            if [ ! -f "Python/${archivos[$i]}" ]; then
              echo "ERROR: No existe ${archivos[$i]}"
              exit 1
            fi

            echo "Ejecutando ${archivos[$i]}"
            python "Python/${archivos[$i]}"

            echo "${mensajes[$i]}"
            echo "=================================="
          done

  # 4. Pruebas automatizadas
  test:
    name: Test with pytest
    runs-on: ubuntu-latest
    needs: exec

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest
