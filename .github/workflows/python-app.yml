# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run tests with coverage
      run: |
        pytest --cov=. --cov-report=term-missing
    - name: Check dependencies
      run: |
        pip install pip-audit
        pip-audit
    - name: Check test coverage
      run: |
        pytest --cov=. --cov-fail-under=80
          - name: Update vulnerable dependencies
        run: |
          python -m pip install --upgrade filelock setuptools
    - name: Security audit
      run: |
        pip install pip-audit
        pip-audit
    - name: Ejecutar talleres Python
      run: |
        cd python

        archivos=("taller1.py" "taller2.py" "t4.py" "t5.py")

        mensajes=(
          "Primer py desarrollado"
          "Segundo PY desarrollado"
          "Tercer PY desarrollado"
          "Cuarto PY desarrollado"
        )

        for i in "${!archivos[@]}"; do
          echo "=================================="
          echo "Ejecutando ${archivos[$i]}"
          python "${archivos[$i]}"
          echo "${mensajes[$i]}"
          echo "=================================="
          done
    - name: Test with pytest
      run: |
        pytest
