# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then
          python -m pip install -r requirements.txt
        fi

        python -m pip install flake8 pytest pytest-cov pip-audit

        # Fix vulnerable dependencies
        python -m pip install --upgrade "filelock>=4.2.1" "setuptools>=84.1.0"

        # Verify dependency compatibility
        python -m pip check
    
    - name: Verificar estructura del proyecto
      run: |
        echo "Directorio actual:"
        pwd

        echo "Archivos y carpetas:"
        ls -la

        echo "Buscar talleres:"
        find . -type f \( \
          -name "taller1.py" -o \
          -name "taller2.py" -o \
          -name "t4.py" -o \
          -name "t5.py" \
        \)
    - name: Ejecutar talleres Python
      run: |
        cd Python

        archivos=("taller1.py" "taller2.py" "t4.py" "t5.py")

        mensajes=(
          "Primer py desarrollado"
          "Segundo PY desarrollado"
          "Tercer PY desarrollado"
          "Cuarto PY desarrollado"
        )

        for i in "${!archivos[@]}"; do
          echo "=================================="
          echo "Ejecutando ${archivos[$i]}"
          python "${archivos[$i]}"
          echo "${mensajes[$i]}"
          echo "=================================="
          done
    - name: Test with pytest
      run: |
        pytest
